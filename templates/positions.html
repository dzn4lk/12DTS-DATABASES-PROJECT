<!DOCTYPE html>
<html>
<head>
    <title>Player Positions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('players') }}">Players</a>
    <a href="{{ url_for('countries') }}">Countries</a>
    <a href="{{ url_for('clubs') }}">Clubs</a>
    <a href="{{ url_for('positions') }}">Positions</a>
</nav>

<h1>Player Positions</h1>

<a href="{{ url_for('add_position') }}">
    <button type="button">+ Add New Position</button>
</a>

<br><br>

<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>Position Name</th>
        <th>Edit</th>
    </tr>

    {% for position in positions %}
    <tr>
        <td>{{ position['ID'] }}</td>
        <td>{{ position['PositionName'] }}</td>
        <td>
            <a href="{{ url_for('edit_position',
                                position_id=position['ID']) }}">
                Edit
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

</body>
</html>
