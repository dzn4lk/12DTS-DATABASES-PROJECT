<!DOCTYPE html>
<html>
<head>
    <title>Clubs</title>
</head>

<body>

    <h1>Football Clubs</h1>

    <a href="{{ url_for('add_club') }}">
        <button type="button">+ Add New Club</button>
    </a>

    <br><br>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Club Name</th>
            <th>Edit</th>
        </tr>

        {% for club in clubs %}

        <tr>

            <td>{{ club['ID'] }}</td>

            <td>{{ club['ClubName'] }}</td>

            <td>
                <a href="{{ url_for('edit_club', club_id=club['ID']) }}">
                    Edit
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
