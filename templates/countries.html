<!DOCTYPE html>
<html>
<head>
    <title>Countries</title>
</head>

<body>

<h1>Countries</h1>

<a href="{{ url_for('add_country') }}">
    <button type="button">+ Add New countries</button>
</a>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Country</th>


    {% for country in countries %}
    <tr>
        <td>{{ country['ID'] }}</td>
        <td>{{ country['CountryName'] }}</td>
            <td>
                <a href="{{ url_for('edit_country', country_id=country['ID']) }}">
                    Edit
                </a>
            </td>


    </tr>
    {% endfor %}

</table>

</body>
</html>
