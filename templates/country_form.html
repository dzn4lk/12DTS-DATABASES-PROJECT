<!DOCTYPE html>
<html>
<head>
    <title>Country</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('players') }}">Players</a>
    <a href="{{ url_for('countries') }}">Countries</a>
    <a href="{{ url_for('clubs') }}">Clubs</a>
    <a href="{{ url_for('positions') }}">Positions</a>
</nav>
    {% if country %}
        <h1>Edit Country</h1>
    {% else %}
        <h1>Add Country</h1>
    {% endif %}

    <!-- Add/Edit Country -->
    <form method="POST">

        <label>Country Name:</label>

        <input
            type="text"
            name="country_name"
            value="{{ country['CountryName'] if country else '' }}"
            required
        >

        <br><br>

        <button type="submit">
            {% if country %}
                Save Changes
            {% else %}
                Add Country
            {% endif %}
        </button>

    </form>


    <!-- Delete Country -->
    {% if country %}

        <form method="POST"
              action="{{ url_for('delete_country', country_id=country['ID']) }}"
              onsubmit="return confirm('Are you sure you want to delete this country?');">

            <button type="submit">
                Delete Country
            </button>

        </form>

    {% endif %}


    <br>

    <a href="{{ url_for('countries') }}">Back to Countries</a>

</body>
</html>
