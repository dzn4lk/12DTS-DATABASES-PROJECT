<!DOCTYPE html>
<html>
<head>
    <title>Club</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<nav>
    <a href="{{ url_for('home') }}">Home</a>

    {% if session.get('user_id') %}
        <a href="{{ url_for('players') }}">Players</a>

        {% if session.get('role') == 'admin' %}
            <a href="{{ url_for('countries') }}">Countries</a>
            <a href="{{ url_for('clubs') }}">Clubs</a>
            <a href="{{ url_for('positions') }}">Positions</a>
        {% endif %}

        <span class="nav-user">
            {{ session.get('email') }}
        </span>

        <a href="{{ url_for('logout') }}">Log Out</a>
    {% else %}
        <a href="{{ url_for('login') }}">Log In</a>
        <a href="{{ url_for('signup') }}">Sign Up</a>
    {% endif %}
</nav>


    {% if club %}
        <h1>Edit Club</h1>
    {% else %}
        <h1>Add Club</h1>
    {% endif %}

    <!-- Add/Edit Club -->
    <form method="POST">

        <label>Club Name:</label>

        <input
            type="text"
            name="club_name"
            value="{{ club['ClubName'] if club else '' }}"
            required
        >

        <br><br>

        <button type="submit">
            {% if club %}
                Save Changes
            {% else %}
                Add Club
            {% endif %}
        </button>

    </form>


    <!-- Delete Club -->
    {% if club %}

        <form method="POST"
              action="{{ url_for('delete_club', club_id=club['ID']) }}"
              onsubmit="return confirm('Are you sure you want to delete this club?');">

            <button type="submit">
                Delete Club
            </button>

        </form>

    {% endif %}


    <br>

    <a href="{{ url_for('clubs') }}">Back to Clubs</a>

</body>
</html>
