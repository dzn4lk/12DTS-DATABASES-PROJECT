<!DOCTYPE html>
<html>
<head>
    <title>Club</title>
</head>

<body>

    {% if club %}
        <h1>Edit Club</h1>
    {% else %}
        <h1>Add Club</h1>
    {% endif %}

    <!-- Add/Edit Club -->
    <form method="POST">

        <label>Club Name:</label>

        <input
            type="text"
            name="club_name"
            value="{{ club['ClubName'] if club else '' }}"
            required
        >

        <br><br>

        <button type="submit">
            {% if club %}
                Save Changes
            {% else %}
                Add Club
            {% endif %}
        </button>

    </form>


    <!-- Delete Club -->
    {% if club %}

        <form method="POST"
              action="{{ url_for('delete_club', club_id=club['ID']) }}"
              onsubmit="return confirm('Are you sure you want to delete this club?');">

            <button type="submit">
                Delete Club
            </button>

        </form>

    {% endif %}


    <br>

    <a href="{{ url_for('clubs') }}">Back to Clubs</a>

</body>
</html>
