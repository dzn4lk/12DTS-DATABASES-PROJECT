<!DOCTYPE html>
<html>
<head>
    <title>Player Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('players') }}">Players</a>
    <a href="{{ url_for('countries') }}">Countries</a>
    <a href="{{ url_for('clubs') }}">Clubs</a>
    <a href="{{ url_for('positions') }}">Positions</a>
</nav>
    {% if player %}
        <h1>Edit Player</h1>
    {% else %}
        <h1>Add Player</h1>
    {% endif %}

    <form method="POST">

        <label>Player Name:</label>
        <input type="text" name="playerName"
               value="{{ player['playerName'] if player else '' }}"
               required>
        <br><br>

        <label>Player Image Filename:</label>
        <input type="text" name="playerImage"
               value="{{ player['playerImage'] if player else '' }}"
               placeholder="e.g. salah.jpg"
               required>
        <br><br>

       ```html
        <!-- COUNTRY DROPDOWN -->
        <label>Country:</label>
        <select name="CountryID" required>
            <option value="">Choose a country</option>

            {% for country in countries %}
            <option value="{{ country['ID'] }}"
                {% if player and player['CountryID'] == country['ID'] %}
                    selected
                {% endif %}>
                {{ country['CountryName'] }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <!-- CLUB DROPDOWN -->
        <label>Club:</label>
        <select name="ClubID" required>
            <option value="">Choose a club</option>

            {% for club in clubs %}
            <option value="{{ club['ID'] }}"
                {% if player and player['ClubID'] == club['ID'] %}
                    selected
                {% endif %}>
                {{ club['ClubName'] }}
            </option>
            {% endfor %}
        </select>

        <br><br>

        <!-- POSITION DROPDOWN -->
        <label>Position:</label>
        <select name="PositionID" required>
            <option value="">Choose a position</option>

            {% for position in positions %}
            <option value="{{ position['ID'] }}"
                {% if player and player['PositionID'] == position['ID'] %}
                    selected
                {% endif %}>
                {{ position['PositionName'] }}
            </option>
            {% endfor %}
        </select>

        <br><br>



        <label>Age:</label>
        <input type="number" name="Age" min="15" max="60"
               value="{{ player['Age'] if player else '' }}"
               required>
        <br><br>

        <label>Market Value (in millions):</label>
        <input type="number" name="MarketValue" min="0" step="0.1"
               value="{{ player['MarketValue'] if player else 0 }}"
               required>
        <br><br>

        <label>Career Goals:</label>
        <input type="number" name="Goals" min="0"
               value="{{ player['Goals'] if player else 0 }}"
               required>
        <br><br>

        <label>Career Matches Played:</label>
        <input type="number" name="MatchesPlayed" min="0"
               value="{{ player['MatchesPlayed'] if player else 0 }}"
               required>
        <br><br>

        <label>International Player?</label>
        <select name="InternationalPlayer" required>
            <option value="1"
                {% if player and player['InternationalPlayer'] == 1 %}selected{% endif %}>
                Yes
            </option>
            <option value="0"
                {% if player and player['InternationalPlayer'] == 0 %}selected{% endif %}>
                No
            </option>
        </select>

        <br><br>

        <button type="submit">
            {% if player %}
                Save Changes
            {% else %}
                Add Player
            {% endif %}
        </button>

    </form>

    {% if player %}
        <form method="POST"
              action="{{ url_for('delete_player',
                                 player_id=player['playerID']) }}"
              onsubmit="return confirm('Are you sure you want to delete this player?');">

            <button type="submit">Delete Player</button>
        </form>
    {% endif %}

    <br>
    <a href="{{ url_for('players') }}">Back to Players</a>

</body>
</html>
```
