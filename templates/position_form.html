<!DOCTYPE html>
<html>
<head>
    <title>Position Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('players') }}">Players</a>
    <a href="{{ url_for('countries') }}">Countries</a>
    <a href="{{ url_for('clubs') }}">Clubs</a>
    <a href="{{ url_for('positions') }}">Positions</a>
</nav>
    {% if position %}
        <h1>Edit Position</h1>
    {% else %}
        <h1>Add Position</h1>
    {% endif %}

    <form method="POST">

        <label>Position Name:</label>

        <input
            type="text"
            name="position_name"
            value="{{ position['PositionName'] if position else '' }}"
            required
        >

        <br><br>

        <button type="submit">
            {% if position %}
                Save Changes
            {% else %}
                Add Position
            {% endif %}
        </button>

    </form>

    {% if position %}
        <form
            method="POST"
            action="{{ url_for('delete_position',
                               position_id=position['ID']) }}"
            onsubmit="return confirm('Are you sure you want to delete this position?');"
        >
            <button type="submit">Delete Position</button>
        </form>
    {% endif %}

    <br>

    <a href="{{ url_for('positions') }}">Back to Positions</a>

</body>
</html>
